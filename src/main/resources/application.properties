spring.application.name=vehiculos-documentos-api

# Conexion a base de datos XAMPP
spring.datasource.url = jdbc:mysql://localhost:3306/transporte
spring.datasource.username = root
spring.datasource.password=
spring.datasource.driver-class-name = com.mysql.cj.jdbc.NonRegisteringDriver

#JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MariaDBDialect


# JWT
jwt.secret=una-clave-secreta-larga-y-dificil-de-adivinar-cambia-esto-1234567890
jwt.expiration-ms=3600000

# --- Google Maps ---
# {direccion} y {clave} son marcadores que el codigo reemplaza (y codifica solo: tildes, comas, espacios).
# La clave NO se escribe aqui: se lee de la variable de entorno GOOGLE_MAPS_API_KEY (si no existe, queda vacia).
google.maps.url-template=https://maps.googleapis.com/maps/api/geocode/json?address={direccion}&key={clave}
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# Con 3 tareas programadas, el valor por defecto (1 hilo) haria que una tarea lenta retrase a las otras
spring.task.scheduling.pool.size=3